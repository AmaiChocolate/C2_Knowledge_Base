name: Deploy Picture Trainer and Flash Cards to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'picture_trainer/**'
      - 'simulator/**'
      - 'flashcards/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run picture trainer tests
        run: node picture_trainer/tests/run_tests.js

      - name: Run simulator tests
        run: node simulator/tests/run_tests.js

      - name: Check flash cards and course match the trainer
        run: |
          node flashcards/build/build_cards.js --check
          node flashcards/build/build_course.js --check

      # The trainer stays at the site root; the flash cards live at /flashcards/.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r picture_trainer/. _site/
          mkdir _site/flashcards
          cp -r flashcards/index.html flashcards/course.html flashcards/style.css flashcards/course.css \
            flashcards/cards_data.js flashcards/course_data.js flashcards/src _site/flashcards/

      # Pages serves files with a 10-minute cache, so a browser can pair a new
      # index.html with old scripts. Stamp local asset URLs with the commit.
      - name: Cache-bust local scripts and styles
        run: sed -i -E 's#(src|href)="((src/[^"]+\.js)|[a-z]+\.css|[a-z_]+_data\.js)"#\1="\2?v=${{ github.sha }}"#' _site/index.html _site/flashcards/index.html _site/flashcards/course.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
