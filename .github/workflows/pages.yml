name: Deploy Picture Trainer to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'picture_trainer/**'
      - 'simulator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run picture trainer tests
        run: node picture_trainer/tests/run_tests.js

      - name: Run simulator tests
        run: node simulator/tests/run_tests.js

      # Pages serves files with a 10-minute cache, so a browser can pair a new
      # index.html with old scripts. Stamp local asset URLs with the commit.
      - name: Cache-bust local scripts and styles
        run: sed -i -E 's#(src|href)="((src/[^"]+\.js)|style\.css)"#\1="\2?v=${{ github.sha }}"#' picture_trainer/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: picture_trainer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
